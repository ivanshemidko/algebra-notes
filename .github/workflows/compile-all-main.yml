name: Compile main.tex and commit PDF

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: '**/main.tex'
          work_in_root_file_dir: true

      - name: Commit and push PDF if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add s2/main.pdf   # или git add **/main.pdf
          git diff --cached --quiet || git commit -m "Update PDF after LaTeX compilation"
          git push || echo "No changes to commit/push"