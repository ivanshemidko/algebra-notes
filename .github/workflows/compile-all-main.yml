name: Compile main.tex and commit PDF

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        include:
          - colorblocks: false
            filename: notes
          - colorblocks: true
            filename: notes-colored
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set colorblocks flag
        run: echo '\colorblocks${{ matrix.colorblocks }}' > config.tex
  
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: '**/main.tex'
          work_in_root_file_dir: true

      - name: Commit and push PDF if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f **/${{ matrix.filename }}.pdf
          git diff --cached --quiet || git commit -m "Update ${{ matrix.filename }}.pdf"
          git pull --rebase
          git push || echo "No changes to commit/push"